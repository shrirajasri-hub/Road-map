<style>

*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0}h1 small{color:var(--muted);font-weight:400}
nav{display:flex;gap:4px;flex-wrap:wrap}nav button{background:none;border:1px solid var(--line);color:var(--muted);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:14px}
nav button.on{background:var(--accent);color:#001;border-color:var(--accent);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:17px}.card h3{margin:14px 0 6px;font-size:15px}
.muted{color:var(--muted)}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--panel2);border-radius:10px;padding:12px}.stat b{display:block;font-size:22px}.stat span{color:var(--muted);font-size:13px}
.banner{padding:12px 14px;border-radius:10px;margin-bottom:16px;border:1px solid}.banner.warn{border-color:var(--warn);background:#2a2210}.banner.bad{border-color:var(--bad);background:#2a1414}.banner.ok{border-color:var(--ok);background:#10241a}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
.s-NOT_STARTED{color:var(--muted)}.s-IN_PROGRESS{color:var(--accent);border-color:var(--accent)}.s-NEEDS_REVISION{color:var(--bad);border-color:var(--bad)}.s-PENDING_VALIDATION{color:var(--warn);border-color:var(--warn)}.s-VALIDATED{color:var(--ok);border-color:var(--ok)}.s-MASTERED{color:var(--vio);border-color:var(--vio)}
.block{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}.block:last-child{border:0}.block .t{min-width:70px;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:8px;font:inherit}
textarea{min-height:70px;resize:vertical}
.btn{background:var(--accent);color:#001;border:0;padding:9px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px}.btn.ghost{background:none;color:var(--text);border:1px solid var(--line)}.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chk{display:flex;gap:8px;align-items:center;padding:6px 0}.chk input{width:auto}
details{background:var(--panel2);border-radius:10px;margin-bottom:8px;border:1px solid var(--line)}summary{cursor:pointer;padding:10px 14px;font-weight:600}
.days{padding:0 10px 10px}.day{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer}.day:hover{background:var(--panel)}.day .n{min-width:52px;color:var(--muted);font-size:13px}.day .tt{flex:1}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
ul{padding-left:20px;margin:6px 0}li{margin:3px 0}
.kbd{font-family:ui-monospace,Consolas,monospace;background:var(--panel2);padding:2px 6px;border-radius:5px;font-size:13px}
.hide{display:none}
@media print{nav,.btn{display:none}}
</style>
</head>

 {m:3,t:"Month 3 — Deep learning",i:["Explain backprop without equations, then with","Precision vs recall for a safety check","How does NMS work?","What breaks when you quantise to INT8?"],p:"Project 2 evaluation report; LinkedIn post on edge optimisation"},
 {m:4,t:"Month 4 — Full-stack",i:["Request lifecycle: React → FastAPI → DB","JWT flow and its risks","Why Docker?","Design the DB for an inspection system"],p:"Project 3 live demo URL"},
 {m:5,t:"Month 5 — GenAI, agents, MCP",i:["Agent vs workflow","RAG vs fine-tuning","Why MCP?","How do you stop an agent doing something harmful?"],p:"Project 5 demo video; write-up 'MCP for industrial vision'"},
 {m:6,t:"Month 6 — Architect & lead",i:["Walk me through a system you designed end to end","How do you estimate a vision project?","How do you mentor a junior who copies AI code?","Tell me about a failure and what you changed"],p:"Capstone + portfolio site + resume; start applying in week 24"}
];

const STATUSES=["NOT_STARTED","IN_PROGRESS","NEEDS_REVISION","PENDING_VALIDATION","VALIDATED","MASTERED"];
const SCORE_PARTS=[["concept","Concept understanding",20],["technical","Technical explanation",15],["problem","Problem solving",20],["practical","Practical implementation",20],["reasoning","Independent reasoning",15],["comm","Communication",10]];

/* Build flat day list */
const DAYS=[];
W.forEach((w,wi)=>{
  w.d.forEach((d,di)=>DAYS.push({n:DAYS.length+1,w:wi+1,m:w.m,wt:w.t,topic:d[0],ex:d[1],q:d[2],assess:false}));
  DAYS.push({n:DAYS.length+1,w:wi+1,m:w.m,wt:w.t,topic:w.d7||"Weekly assessment & revision (no new topic)",ex:"20 concept questions · 5 practical · 2 coding exercises · 1 requirement analysis · 1 meeting simulation",q:"Explain this week's hardest concept to a junior without notes",assess:true});
});

/* ================== STATE ================== */
const KEY="raji_ai_programme_v1";
let S={settings:{name:"Raji",start:"",time:"19:00"},days:{},gaps:[],lastSession:null,career:{}};
function load(){try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
load();
const rec=n=>S.days[n]||(S.days[n]={status:"NOT_STARTED",scores:{},notes:"",weak:"",checks:{},date:""});

/* ================== HELPERS ================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const iso=d=>d.toISOString().slice(0,10);
function calDay(){if(!S.settings.start)return null;const s=new Date(S.settings.start+"T00:00:00");return Math.floor((today()-s)/864e5)+1;}
function pendingDay(){for(const d of DAYS){const st=rec(d.n).status;if(!["VALIDATED","MASTERED"].includes(st))return d.n;}return DAYS.length;}
function total(n){const s=rec(n).scores;let t=0,any=false;SCORE_PARTS.forEach(([k])=>{if(s[k]!==undefined&&s[k]!==""){t+=+s[k];any=true;}});return any?t:null;}
function level(t){if(t==null)return"—";return t<40?"Foundation not established":t<60?"Basic understanding":t<75?"Developing":t<85?"Independent working knowledge":t<95?"Strong practical proficiency":"Demonstrated mastery";}
function gapDays(){if(!S.lastSession)return 0;return Math.floor((today()-new Date(S.lastSession+"T00:00:00"))/864e5);}
const pill=s=>`<span class="pill s-${s}">${s.replace(/_/g," ")}</span>`;

/* ================== VIEWS ================== */
const TABS=[["today","Today"],["roadmap","Roadmap"],["register","Progress register"],["gaps","Knowledge gaps"],["career","Career & interviews"],["method","How to learn"],["settings","Settings & reminders"]];
let tab="today",openDay=null;
function nav(){$("#nav").innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?"on":""}" onclick="go('${k}')">${l}</button>`).join("");}
function go(k,d){tab=k;openDay=d||null;render();window.scrollTo(0,0);}

function vToday(){
  if(!S.settings.start)return `<div class="card"><h2>Set your start date</h2><p class="muted">The programme is 182 days (26 weeks, every 7th day an assessment). Choose Day 1.</p>
   <label>Start date</label><input type="date" id="sd" value="${iso(today())}"><label>Daily session time</label><input type="time" id="st" value="${S.settings.time}">
   <p><button class="btn" onclick="S.settings.start=$('#sd').value;S.settings.time=$('#st').value;save();render()">Start programme</button></p></div>`;
  const p=pendingDay(),c=calDay(),g=gapDays();
  let banner="";
  if(g>=3)banner=`<div class="banner bad"><b>${g} days missed.</b> Rule: short revision of the last validated week, then restart the routine. Do not take a new topic today.</div>`;
  else if(g===2||(g===1&&c>p+1))banner=`<div class="banner warn"><b>You missed a session.</b> Resume from the pending lesson — Day ${p}. No skipping.</div>`;
  if(c&&p<c-7)banner+=`<div class="banner warn">You are ${c-p} days behind the calendar. That is acceptable — progress is measured by validation, not dates. Do not rush.</div>`;
  const done=DAYS.filter(d=>["VALIDATED","MASTERED"].includes(rec(d.n).status)).length;
  const sc=DAYS.map(d=>total(d.n)).filter(x=>x!=null);const avg=sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):null;
  return banner+`<div class="grid g4">
   <div class="stat"><b>Day ${p}</b><span>Pending lesson</span></div>
   <div class="stat"><b>${c>0?c:"—"}</b><span>Calendar day</span></div>
   <div class="stat"><b>${done}/${DAYS.length}</b><span>Validated days</span></div>
   <div class="stat"><b>${avg??"—"}</b><span>Avg score · ${level(avg)}</span></div></div>
   <div class="bar" style="margin:12px 0 16px"><i style="width:${done/DAYS.length*100}%"></i></div>`+dayCard(p,true);
}

function dayCard(n,isToday){
  const d=DAYS[n-1],r=rec(n),t=total(n);
  const blocks=[["00–10","Revision — explain the previous lesson without notes. Check the previous assignment."],["10–25","New concept: "+esc(d.topic)],["25–45","Practical: "+esc(d.ex)],["45–55","Questions & independent explanation: "+esc(d.q)],["55–60","Score yourself (below), record weak areas, commit code."]];
  const chk=[["rev","Revision done without notes"],["learn","Lesson studied (in the Learn project chat)"],["prac","Practical completed and code committed"],["q","Validation question answered in my own words"],["eval","Scored and logged"]];
  return `<div class="card">
  <div class="row" style="justify-content:space-between"><h2>Day ${n} · Week ${d.w} · Month ${d.m}</h2>${pill(r.status)}</div>
  <p class="muted" style="margin:0 0 6px">${esc(d.wt)}</p>
  <h3 style="font-size:17px">${esc(d.topic)}</h3>
  ${d.assess?`<div class="banner warn">Assessment day — no new topic unless the week is validated.</div>`:""}
  <div>${blocks.map(b=>`<div class="block"><div class="t">${b[0]}</div><div>${b[1]}</div></div>`).join("")}</div>
  <div class="banner ok" style="margin-top:12px">To start the lesson, open the <b>Learn</b> project in Claude and send: <span class="kbd">Day ${n} — start</span>. The lesson, questions and validation happen there. Bring your answers back here.</div>
  <div class="grid g2"><div><h3>Session checklist</h3>${chk.map(([k,l])=>`<label class="chk"><input type="checkbox" ${r.checks[k]?"checked":""} onchange="rec(${n}).checks['${k}']=this.checked;save()">${l}</label>`).join("")}</div>
  <div><h3>Score (/100) — ${t??"—"} · ${level(t)}</h3>${SCORE_PARTS.map(([k,l,mx])=>`<label>${l} (/${mx})</label><input type="number" min="0" max="${mx}" value="${r.scores[k]??""}" onchange="setScore(${n},'${k}',this.value,${mx})">`).join("")}</div></div>
  <label>Status</label><select onchange="setStatus(${n},this.value)">${STATUSES.map(s=>`<option ${s===r.status?"selected":""} value="${s}">${s.replace(/_/g," ")}</option>`).join("")}</select>
  <label>Concepts NOT understood / weak areas (these go to the gap register)</label><textarea onchange="rec(${n}).weak=this.value;save()">${esc(r.weak)}</textarea>
  <label>Notes in my own words</label><textarea onchange="rec(${n}).notes=this.value;save()">${esc(r.notes)}</textarea>
  <p class="row"><button class="btn" onclick="logSession(${n})">Log today's session</button>${!isToday?`<button class="btn ghost" onclick="go('roadmap')">← Roadmap</button>`:""}</p>
  </div>`;
}
function setScore(n,k,v,mx){v=v===""?"":Math.max(0,Math.min(mx,+v));rec(n).scores[k]=v;save();render();}
function setStatus(n,v){
  const r=rec(n);
  if(v==="MASTERED"&&!(r.checks.prac&&r.checks.q&&(total(n)||0)>=95)){alert("MASTERED needs evidence: practical done, validation answered and a score of 95+. Use VALIDATED or PENDING VALIDATION.");render();return;}
  if(v==="VALIDATED"&&!(r.checks.prac&&r.checks.q)){alert("VALIDATED needs the practical and the validation question completed first.");render();return;}
  if(v==="VALIDATED"&&(total(n)??0)<60){alert("A score below 60 is NEEDS REVISION, not VALIDATED.");render();return;}
  r.status=v;save();render();
}
function logSession(n){const r=rec(n);r.date=iso(today());S.lastSession=r.date;if(r.status==="NOT_STARTED")r.status="IN_PROGRESS";
  if(r.weak.trim())r.weak.split(/\n|;/).map(x=>x.trim()).filter(Boolean).forEach(w=>{if(!S.gaps.find(g=>g.t.toLowerCase()===w.toLowerCase()))S.gaps.push({t:w,day:n,st:"NEEDS_REVISION",date:r.date});});
  const t=total(n);if(t!=null&&t<60&&r.status!=="NEEDS_REVISION"){r.status="NEEDS_REVISION";alert("Score below 60 → marked NEEDS REVISION. Redo a smaller exercise and retest before moving on.");}
  save();render();}

function vRoadmap(){
  if(openDay)return dayCard(openDay,false);
  let h=`<div class="card"><h2>182-day roadmap</h2><p class="muted">6 months · 26 weeks · every 7th day is an assessment. Click any day to open it. Topics extend when validation fails — the dates follow you, not the other way round.</p></div>`;
  for(let m=1;m<=6;m++){
    const md=DAYS.filter(d=>d.m===m),v=md.filter(d=>["VALIDATED","MASTERED"].includes(rec(d.n).status)).length;
    h+=`<div class="card"><h2>Month ${m} <span class="muted" style="font-weight:400;font-size:14px">· ${v}/${md.length} validated</span></h2>`;
    [...new Set(md.map(d=>d.w))].forEach(w=>{
      const wd=DAYS.filter(d=>d.w===w);
      h+=`<details ${wd.some(d=>d.n===pendingDay())?"open":""}><summary>Week ${w}: ${esc(W[w-1].t)}</summary><div class="days">${wd.map(d=>`<div class="day" onclick="go('roadmap',${d.n})"><span class="n">Day ${d.n}</span><span class="tt">${d.assess?"📝 ":""}${esc(d.topic)}</span>${pill(rec(d.n).status)}</div>`).join("")}</div></details>`;
    });h+=`</div>`;
  }return h;
}

function vRegister(){
  const rows=DAYS.filter(d=>rec(d.n).date||rec(d.n).status!=="NOT_STARTED");
  const dom={};DAYS.forEach(d=>{const t=total(d.n);if(t!=null){(dom[d.m]=dom[d.m]||[]).push(t);}});
  return `<div class="card"><h2>Month-wise proficiency</h2><div class="grid g4">${[1,2,3,4,5,6].map(m=>{const a=dom[m];const v=a?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;return `<div class="stat"><b>${v??"—"}</b><span>Month ${m} · ${level(v)}</span></div>`}).join("")}</div></div>
  <div class="card"><h2>Progress register</h2>${rows.length?`<div style="overflow-x:auto"><table><tr><th>Date</th><th>Day</th><th>Month</th><th>Topic</th><th>Status</th><th>Practical</th><th>Concept</th><th>Score</th><th>Weak areas</th></tr>${rows.map(d=>{const r=rec(d.n);return `<tr onclick="go('roadmap',${d.n})" style="cursor:pointer"><td>${r.date||"—"}</td><td>${d.n}</td><td>${d.m}</td><td>${esc(d.topic)}</td><td>${pill(r.status)}</td><td>${r.checks.prac?"✔":"—"}</td><td>${r.checks.q?"✔":"—"}</td><td>${total(d.n)??"—"}</td><td>${esc(r.weak)}</td></tr>`}).join("")}</table></div>`:`<p class="muted">No sessions logged yet.</p>`}</div>`;
}

function vGaps(){
  return `<div class="card"><h2>Knowledge gap register</h2><p class="muted">Filled automatically from "weak areas" when you log a session. Update only from real assessments, not feelings.</p>
  <div class="row"><input id="ng" placeholder="Add a gap, e.g. Python references & copying" style="flex:1"><button class="btn" onclick="if($('#ng').value.trim()){S.gaps.push({t:$('#ng').value.trim(),day:pendingDay(),st:'NEEDS_REVISION',date:iso(today())});save();render()}">Add</button></div>
  ${S.gaps.length?`<table style="margin-top:12px"><tr><th>Gap</th><th>From day</th><th>Logged</th><th>Status</th><th></th></tr>${S.gaps.map((g,i)=>`<tr><td>${esc(g.t)}</td><td>${g.day}</td><td>${g.date}</td><td><select onchange="S.gaps[${i}].st=this.value;save();render()">${STATUSES.map(s=>`<option ${s===g.st?"selected":""} value="${s}">${s.replace(/_/g," ")}</option>`).join("")}</select></td><td><button class="btn ghost sm" onclick="S.gaps.splice(${i},1);save();render()">✕</button></td></tr>`).join("")}</table>`:`<p class="muted">No gaps recorded.</p>`}</div>`;
}

function vCareer(){
  return `<div class="card"><h2>Target: Startup → MNC as a CV / AI Lead</h2>
  <p>To get that role you need <b>proof</b>, not certificates: 6 portfolio projects, the ability to defend design decisions, and STAR stories from your real industrial deliveries (sealer detection, panel inspection, mould-press safety, Hailo edge pipelines). Those deliveries already count. What's missing is depth in the fundamentals and being able to explain them in an interview.</p>
  <p class="muted">Honest note: many MNCs hire "AI Lead" for people with a track record of shipped systems + team ownership. If month 6 shows strong scores, apply for Lead roles; in parallel apply for Senior CV Engineer roles. Treat both as wins.</p></div>
  ${CAREER.map(c=>`<div class="card"><h2>${c.t}</h2><h3>Interview questions you must answer by month-end</h3><ul>${c.i.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><h3>Portfolio milestone</h3><label class="chk"><input type="checkbox" ${S.career[c.m]?"checked":""} onchange="S.career[${c.m}]=this.checked;save()">${esc(c.p)}</label></div>`).join("")}`;
}

function vMethod(){
  return `<div class="card"><h2>How to actually remember Python (and everything else)</h2>
  <h3>1. You don't memorise syntax — you build recall</h3><ul>
  <li><b>Type, never paste.</b> Every line of code from a lesson is typed by hand. Copy-paste teaches nothing.</li>
  <li><b>Predict before you run.</b> Write down what you expect the output to be, then run it. When you're wrong, that's where the learning happens.</li>
  <li><b>Retrieval first.</b> The first 10 minutes of each session = explain yesterday's topic without notes. If you can't recall it, you haven't learned it yet.</li>
  <li><b>Spaced revision.</b> Revisit each topic on day +1, +3, +7 and +30. The weekly assessment day handles +7.</li>
  <li><b>Your own cheat-sheet.</b> Keep one file, <span class="kbd">my_python_notes.md</span>, written in your own words with one tiny example per concept. You may look things up in it, but never AI-generated code you don't understand.</li></ul>
  <h3>2. How to solve any coding problem (use this every time)</h3><ol>
  <li>Restate the problem in one sentence.</li><li>Write the input and the expected output for 2 examples.</li><li>Write the steps in plain English (pseudocode) <i>before</i> code.</li><li>Code one step at a time, running after each.</li><li>When it breaks: read the traceback bottom-up → reproduce with the smallest input → check one assumption at a time.</li><li>Explain the final code line by line out loud.</li></ol>
  <h3>3. Python essentials you must own (non-negotiable)</h3><ul>
  <li>Types, references & mutability · lists / tuples / dicts / sets · loops & comprehensions</li>
  <li>Functions, scope, modules · files with pathlib · exceptions · logging</li>
  <li>Classes, dataclasses, type hints · virtual environments & pip · Git</li>
  <li>Threading & queues (camera pipelines) · NumPy — because every image is an array</li></ul>
  <h3>4. The AI-dependency rule</h3><ul>
  <li>Attempt first for at least 15 minutes. Then ask Claude for a <b>hint</b>, not the solution.</li>
  <li>If you use any AI-written line at work, you must be able to explain it. If you can't, add it to the gap register.</li>
  <li>Once a week, rebuild one small piece of a real Vidana project from scratch with no AI.</li></ul></div>`;
}

function vSettings(){
  return `<div class="card"><h2>Settings</h2><div class="grid g2">
  <div><label>Programme start date (Day 1)</label><input type="date" value="${S.settings.start}" onchange="S.settings.start=this.value;save();render()"></div>
  <div><label>Daily session time</label><input type="time" value="${S.settings.time}" onchange="S.settings.time=this.value;save()"></div></div></div>
  <div class="card"><h2>Reminders</h2>
  <p><b>Recommended:</b> download the calendar reminder and import it into Google Calendar or your phone. It repeats every day at your session time with a 10-minute alert, and it works even when this page is closed.</p>
  <p class="row"><button class="btn" onclick="ics()">Download daily reminder (.ics)</button><button class="btn ghost" onclick="notif()">Enable browser alert (tab must be open)</button></p></div>
  <div class="card"><h2>Backup & sync</h2><p class="muted">Progress is saved in this browser. Export it weekly, and import it on another device to continue there. Share the export with Claude in the Learn project for your weekly review.</p>
  <p class="row"><button class="btn" onclick="exportJSON()">Export progress (.json)</button><label class="btn ghost" style="margin:0">Import<input type="file" accept=".json" class="hide" onchange="importJSON(this.files[0])"></label><button class="btn ghost" onclick="exportCSV()">Export register (.csv)</button><button class="btn ghost" onclick="window.print()">Print / PDF report</button></p>
  <p><button class="btn ghost sm" onclick="if(confirm('Erase ALL progress on this device? Export first.')){localStorage.removeItem(KEY);location.reload()}">Reset all progress</button></p></div>`;
}

/* ================== ACTIONS ================== */
function dl(name,data,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();}
function exportJSON(){dl(`ai-programme-progress-${iso(today())}.json`,JSON.stringify(S,null,2),"application/json");}
function importJSON(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();render();alert("Progress imported.");}catch(e){alert("Invalid file.");}};r.readAsText(f);}
function exportCSV(){const h=["Date","Day","Week","Month","Topic","Status","Practical","Concept","Score","Weak areas"];
  const rows=DAYS.map(d=>{const r=rec(d.n);return[r.date,d.n,d.w,d.m,d.topic,r.status,r.checks.prac?"Y":"",r.checks.q?"Y":"",total(d.n)??"",r.weak].map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(",");});
  dl(`ai-programme-register-${iso(today())}.csv`,[h.join(","),...rows].join("\n"),"text/csv");}
function ics(){const st=(S.settings.start||iso(today())).replace(/-/g,""),tm=(S.settings.time||"19:00").replace(":","")+"00";
  const end=String((+S.settings.time.split(":")[0]+1)%24).padStart(2,"0")+S.settings.time.split(":")[1]+"00";
  const body=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Raji//AI Programme//EN","BEGIN:VEVENT",`UID:ai-programme-${st}@raji`,`DTSTAMP:${st}T000000`,`DTSTART;TZID=Asia/Kolkata:${st}T${tm}`,`DTEND;TZID=Asia/Kolkata:${st}T${end}`,"RRULE:FREQ=DAILY;COUNT=182","SUMMARY:AI Programme — 1-hour session","DESCRIPTION:Open your programme app → Today. Then in Claude's Learn project send 'Day N — start'. Revision first!","BEGIN:VALARM","TRIGGER:-PT10M","ACTION:DISPLAY","DESCRIPTION:AI session in 10 minutes","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  dl("ai-programme-daily-reminder.ics",body,"text/calendar");}
let nt=null;function notif(){if(!("Notification"in window))return alert("Notifications are not supported here.");Notification.requestPermission().then(p=>{if(p!=="granted")return alert("Permission denied.");
  clearInterval(nt);nt=setInterval(()=>{const n=new Date(),hm=n.toTimeString().slice(0,5);if(hm===S.settings.time&&S.lastSession!==iso(today())){new Notification("AI Programme",{body:`Day ${pendingDay()} is waiting. Revision first.`});}},60000);alert("Alert active while this tab stays open.");});}

/* ================== RENDER ================== */
function render(){nav();$("#hdrsub").textContent=S.settings.start?`· ${S.settings.name} · Day ${pendingDay()} pending`:"";
  $("#app").innerHTML={today:vToday,roadmap:vRoadmap,register:vRegister,gaps:vGaps,career:vCareer,method:vMethod,settings:vSettings}[tab]();}
render();
</script>
